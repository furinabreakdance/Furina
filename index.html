<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eswa Anggit Pandhito</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0f1e;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
    }
    header { padding: 50px 20px; }
    .profile-pic {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #38bdf8;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 3rem;
      background: linear-gradient(135deg, #38bdf8, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .tagline {
      color: #94a3b8;
      margin: 20px 0;
    }
    .social-links {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin: 30px 0;
    }
    .social-links a {
      color: white;
      font-size: 2rem;
      background: #1e293b;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
      margin: 20px auto;
      max-width: 600px;
    }
    .contact {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      padding: 30px;
      border-radius: 20px;
      max-width: 600px;
      margin: 40px auto;
    }
  </style>
</head>
<body>
  <header>
    <!-- GANTI 'fotoku.jpg' DENGAN NAMA FILE FOTO LU -->
    <img src="MyBini.jpg" alt="Foto Profil" class="profile-pic">
    <h1>Eswa Anggit Pandhito</h1>
    <div class="tagline">Pelajar | Calon Suami Furina</div>
    <div class="social-links">
      <a href="https://instagram.com/anggit0twgonnabe"><i class="fab fa-instagram"></i></a>
      <a href="https://tiktok.com/@anticlimaxz"><i class="fab fa-tiktok"></i></a>
      <a href="mailto:furinabreakdance@gmail.com"><i class="fas fa-envelope"></i></a>
    </div>
  </header>

  <div class="card">
    <h2>Tentang Saya</h2>
    <p>Pecinta Furina asli sejak jaman Australophitecus.</p>
  </div>

  <div class="contact">
    <h2>Kontak</h2>
    <p><i class="fas fa-envelope"></i> furinabreakdance@gmail.com</p>
    <p><i class="fas fa-map-marker-alt"></i> Bantargebang, Bekasi</p>
  </div>

  <footer style="padding: 20px; color: #94a3b8;">
    © 2026 Eswa Anggit
  </footer>
</body>
</html>
